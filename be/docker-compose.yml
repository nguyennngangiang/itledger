# docker-compose.yml
name: itledger

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: poop
      POSTGRES_DB: itledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  # NOTE: the AI stack (embedder + Ollama LLM) runs on the Windows HOST, not in
  # Docker — the embedder needs the Intel NPU (unreachable from a container) and
  # Ollama is faster on the host. `npm run dev` in fe/ starts Vite + the host AI
  # service (:8001, ai/run-host.ps1) + Ollama (:11434) together. This compose
  # file only runs Postgres + the API; the API reaches the host AI service via
  # host.docker.internal.

  api:
    image: python:3.12-slim
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      DATABASE_URL: postgresql://postgres:poop@db:5432/itledger
      CORS_ORIGINS: http://localhost:5173
      # The embedding + LLM service runs on the host (see note above); reach it
      # from inside the container via host.docker.internal. Port 8010, not 8001 —
      # see ai/run-host.ps1.
      AI_URL: http://host.docker.internal:8010
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      sh -c "pip install --no-cache-dir -r be/requirements.txt &&
             uvicorn be.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
