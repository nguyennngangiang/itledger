# Xoay vòng log cho MỌI service. `json-file` mặc định tăng VÔ HẠN: đo trên
# chính VPS này, log của một container đã đạt 2,25 GB trong một tệp duy nhất, và
# `docker system df` KHÔNG đếm log container nên nó vô hình với mọi lần kiểm
# dung lượng thông thường.
x-log: &log
  driver: json-file
  options: {max-size: "50m", max-file: "3"}

# IT Ledger on a Linux VPS — the whole stack, standalone.
#
# DRAFT: written on the Windows server during the move and never started there,
# because there was no Linux host to start it on. Read it before running it.
#
#   docker compose -f deploy/vps/docker-compose.vps.yml up -d --build
#
# Run from the REPO ROOT (the build contexts are repo-relative). Unlike the LAN
# deployment there is no WSL in the picture and no `-f docker-compose.yml -f
# docker-compose.prod.yml` pair to merge: this file replaces both.
#
# Differences from be/docker-compose.yml that matter:
#   - The API is a built image (deploy/vps/Dockerfile.api), not a bind-mounted
#     repo with pip running at container start.
#   - No extra_hosts / AI_URL. The embedder and the LLM are gone — AI_ENABLED=0
#     is the deployed state and nothing calls out to a model.
#   - POSTGRES_PASSWORD comes from the environment. The LAN files hard-code
#     `poop`, which was survivable on an office network behind a loopback bind
#     and is not survivable on a VPS. Put a real one in .env beside this file.
#   - Postgres publishes nothing at all. Only the api container talks to it.
name: itledger

services:
  db:
    # pgvector/pgvector:pg16 is postgres:16 plus the `vector` extension
    # (be/repositories/document.py DOCUMENTS_DDL) — multi-arch, same data
    # directory format, so it's a drop-in swap onto the existing volume.
    image: pgvector/pgvector:pg16
    logging: *log
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/vps/.env}
      POSTGRES_DB: ${POSTGRES_DB:-itledger}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs ONCE, on a fresh volume only. It creates the unaccent extension and
      # the empty schema — which is why restore-db.sh must pass --clean
      # --if-exists when it loads the dump on top. See that script's header.
      - ../../be/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # No ports. Nothing outside this compose network needs Postgres; reach it
    # with `docker compose exec db psql -U postgres -d itledger`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-itledger}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local model runtime for the document RAG feature (be/routers/documents.py):
  # bge-m3 for embeddings, qwen2.5:7b as the server-side chat fallback for a
  # browser without WebGPU. CPU-only on this host — no GPU passthrough, nothing
  # to configure beyond the image. No published port: only `api` reaches it,
  # over this compose network, same as `db`.
  #
  # Pull the models once after the stack is up (not automated — same "run it by
  # hand once" spirit as dump-db.sh/restore-db.sh):
  #   docker compose -f deploy/vps/docker-compose.vps.yml exec ollama ollama pull qwen2.5:7b
  #   docker compose -f deploy/vps/docker-compose.vps.yml exec ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:latest
    logging: *log
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  api:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile.api
    logging: *log
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-itledger}
      # Caddy serves the SPA and /api from one origin, so CORS is not exercised
      # by the app. Kept for direct API calls while troubleshooting.
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      # Master switch for everything be/llm.py reaches (chat, tool-calling,
      # rerank). ON now that ollama (above) is a real local chat server — only
      # used here by the /documents/ask server-side fallback. The retired Ask
      # AI router (be/routers/assistant.py) stays unmounted regardless.
      AI_ENABLED: "1"
      LLM_BASE_URL: http://ollama:11434/v1
      # Settled on 7b over 3b after trying both for real. 3b was faster
      # (~50-60s/answer vs ~106s here) and always answered in the question's
      # own language, but its prose was sometimes terse/off (one answer was
      # just the source filename). 7b's content is noticeably better and it
      # follows "use the fleet stats verbatim" well enough to skip needless
      # tool calls on count questions (a few seconds instead of a full tool
      # round-trip) — traded off against occasionally answering in English to
      # a Vietnamese question, and staying slow on anything needing a long
      # generated answer. Revisit if that language slip turns out to bite.
      LLM_MODEL: qwen2.5:7b
      # be/embeddings.py — independent of AI_ENABLED, see that module.
      EMBED_BASE_URL: http://ollama:11434
      EMBED_MODEL: bge-m3
      # Scan screen (be/scan.py): Claude reads paperwork via `claude -p` on the
      # HOST, under the host's logged-in Claude account — no API key. The runner
      # (deploy/vps/claude-runner.py, systemd unit itledger-claude-runner)
      # listens on a unix socket in the directory mounted below.
      CLAUDE_RUNNER_SOCKET: /run/itledger-claude/claude.sock
      SCAN_MODEL: ${SCAN_MODEL:-claude-opus-5-5}
    # Loopback only: Caddy on the host is what puts this on the internet.
    # The directory, not the socket file: the runner recreates the socket on
    # every restart, and a file bind-mount would keep pointing at the old one.
    volumes:
      - /run/itledger-claude:/run/itledger-claude
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
  ollama_data:
