# Minimal mirror of /etc/nginx/sites-available/itledger's routing shape (SPA +
# /api proxy), for the isolated Strix pentest target only. Not deployed to
# production — see docker-compose.strix-test.yml.
server {
    listen 80;

    # Strix findings VULN-0003/0005/0006 (missing CSP / X-Content-Type-Options /
    # X-Frame-Options) — scoped to what index.html actually loads (Google
    # Fonts CSS + font files; everything else is same-origin, no inline
    # scripts). Verified here first, then mirrored to production's
    # /etc/nginx/sites-available/itledger.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
